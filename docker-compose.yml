version: '3.8'

volumes:
  msf-db:

networks:
  labnet:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24

services:
  metasploitable:
    image: tleemcjr/metasploitable2
    container_name: metasploitable
    networks:
      labnet:
        ipv4_address: 192.168.100.2
    privileged: true
    command: >
      /bin/sh -c "
      service ssh start &&
      service apache2 start &&
      service distcc start &&
      service postgresql-8.3 start &&
      service samba start &&
      service proftpd start &&
      service mysql start &&
      service tomcat5.5 start &&
      service xinetd start &&
      /usr/bin/unrealircd &&
      while true; do sleep 1; done"

  kali:
    build: .
    container_name: kali
    networks:
      labnet:
        ipv4_address: 192.168.100.3
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - msf-db:/var/lib/postgresql
      - ./scripts:/root/scripts
    command: /bin/bash /root/scripts/kali-start.sh
